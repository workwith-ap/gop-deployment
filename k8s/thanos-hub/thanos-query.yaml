apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  namespace: gop-thanos
spec:
  replicas: 2
  selector:
    matchLabels: {app: thanos-query}
  template:
    metadata:
      labels: {app: thanos-query}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: thanos-query
          image: quay.io/thanos/thanos:v0.36.1
          args:
            - query
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:9090
            - --query.replica-label=replica
            - --store=dnssrv+_grpc._tcp.thanos-receive-headless.gop-thanos.svc.cluster.local
            - --store=dnssrv+_grpc._tcp.thanos-store.gop-thanos.svc.cluster.local
          ports:
            - {containerPort: 9090, name: http}
            - {containerPort: 10901, name: grpc}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  namespace: gop-thanos
spec:
  selector: {app: thanos-query}
  ports:
    - {name: http, port: 9090, targetPort: 9090}
    - {name: grpc, port: 10901, targetPort: 10901}
