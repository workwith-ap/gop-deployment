apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-lag-check-config
  namespace: gop-telegraf
data:
  lag.conf: |
    [agent]
      snmp_translator = "gosmi"
    [[inputs.snmp]]
      agents = ["udp://egress-proxy-snmp.gop-telegraf.svc.cluster.local:16005"]
      version = 2
      community = "DE-SNMP-RO"
      timeout = "10s"
      retries = 3

      # Which AE bundle each port is attached to (IEEE 802.3ad LAG MIB,
      # dot3adAggPortAttachedAggID). The row index is the port's ifIndex.
      [[inputs.snmp.table]]
        name = "lag_port"
        index_as_tag = true
        [[inputs.snmp.table.field]]
          name = "attached_agg_id"
          oid = ".1.2.840.10006.300.43.1.2.1.1.13"

      # Port names by ifIndex, to read the result in plain words.
      [[inputs.snmp.table]]
        name = "if_name"
        index_as_tag = true
        [[inputs.snmp.table.field]]
          name = "ifName"
          oid = ".1.3.6.1.2.1.31.1.1.1.1"
    [[outputs.file]]
      files = ["stdout"]
  run.sh: |
    timeout 90 telegraf --config /etc/snmp-lag/lag.conf --once > /tmp/lag.out 2> /tmp/lag.log
    echo "=================== errors/warnings"
    grep -E " (E|W)! " /tmp/lag.log | grep -v "Strict environment" | head -5 | cut -c1-300
    echo "=================== lag_port lines (expect one per port)"
    grep -c '^lag_port' /tmp/lag.out
    grep '^lag_port' /tmp/lag.out | cut -c1-200
    echo "=================== port names (xe / et / ae only)"
    grep '^if_name' /tmp/lag.out | grep -E 'ifName="?(xe-|et-|ae)' | cut -c1-200
---
apiVersion: v1
kind: Pod
metadata:
  name: snmp-lag-check
  namespace: gop-telegraf
spec:
  restartPolicy: Never
  containers:
    - name: telegraf
      image: telegraf:1.39.3
      command: ["sh", "/etc/snmp-lag/run.sh"]
      volumeMounts:
        - {name: cfg, mountPath: /etc/snmp-lag}
  volumes:
    - name: cfg
      configMap: {name: snmp-lag-check-config}