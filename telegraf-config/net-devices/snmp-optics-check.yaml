    [[outputs.file]]
      files = ["stdout"]
  run.sh: |
    timeout 120 telegraf --config /etc/snmp-optics/optics.conf --once > /tmp/o.out 2> /tmp/o.log
    tr -c '[:print:]\n' '?' < /tmp/o.out > /tmp/o.txt
    echo "=== errors"
    grep -E " (E|W)! " /tmp/o.log | grep -vE "Strict environment|skip_processors_after|agent_host_tag" | head -8 | cut -c1-300
    echo "=== dom rows"
    grep -c "^dom," /tmp/o.txt
    grep "^dom," /tmp/o.txt | head -4 | sed -E 's/agent_host=[^,]*,host=[^,]*,//' | cut -c1-900
---
apiVersion: v1
kind: Pod
metadata:
  name: snmp-optics-check
  namespace: gop-telegraf
spec:
  restartPolicy: Never
  containers:
    - name: telegraf
      image: telegraf:1.39.3
      command: ["sh", "/etc/snmp-optics/run.sh"]
      volumeMounts:
        - {name: cfg, mountPath: /etc/snmp-optics}
  volumes:
    - name: cfg
      configMap: {name: snmp-optics-check-config}