# ============================================================================
# telegraf-th-sensor-map
# ============================================================================
# The single source of truth for every TH sensor. Onboarding a new sensor
# is: add one row here, `kubectl apply`, `rollout restart`. Nothing else
# changes — no new TOML block, no manual iptables command, no Service edit.
#
# Built from the full 150-row mapping file, deduplicated: that file lists
# each physical sensor TWICE (once for its temp point, once for its
# humidity point) because that's how the asset-tracking system labels
# the two logical readings — but it's the same 75 physical devices, each
# sending ONE packet containing both temperature AND humidity together

# DERIVED FROM PROJECT HORUS TYO6 FILE

#
# Columns:
#   ip                     — sensor's real source IP (mapping file col A)
#   internal_listener_port — NOT a real network port. Every sensor still
#                            sends to 3184 on the wire — same as the
#                            mapping file, same as the firewall rule,
#                            nothing about that changes. This value only
#                            exists AFTER the packet is already inside the
#                            pod: iptables silently redirects it here so a
#                            dedicated socket_listener block can tag it
#                            with the right sensor_ip. 3184 itself is
#                            reserved for whichever one sensor needs no
#                            redirect (currently .177, since it was
#                            already live before this scheme existed) —
#                            every other sensor gets a unique value from
#                            3185 up. Never appears on any Service,
#                            firewall rule, or in the mapping file itself
#                            — see file 07's comments for why the Service
#                            only ever exposes 3184.
#   provider_tag_temp      — mapping file's point ID for this sensor's
#                            temperature reading (col F, *_temp1 rows)
#   provider_tag_hum       — mapping file's point ID for this sensor's
#                            humidity reading (col F, *_hum1 rows)
#   equipment_name         — mapping file column H (identical across both
#                            source rows for a given IP, as expected —
#                            same physical device)
#   location                — mapping file column K (also identical
#                            across both source rows per IP)
# ============================================================================

