# ============================================================================
# telegraf-th-sensor-render-script
# ============================================================================
# Runs once, at pod startup, inside the TH sensor init container (see file 06).
# Reads sensors.csv (file 04) and produces two things:
#   1. One iptables PREROUTING REDIRECT rule per non-3184 sensor, so that
#      sensor's traffic (all sensors send to :3184 on the wire) gets
#      locally redirected to its own dedicated port before Telegraf's
#      socket_listener sees it — this is what makes per-sensor tagging
#      possible despite socket_listener having no source-IP awareness.
#   2. One [[inputs.socket_listener]] block per sensor in th-sensor-udp.conf,
#      each bound to its own port, each with static tags identifying
#      that specific sensor (sensor_ip, provider_tag_temp, provider_tag_hum,
#      equipment_name, location) plus the WIFI-TH datasheet-accurate field
#      layout. Both provider tags are attached to the same block since one
#      packet carries both readings — see file 04 for why the source
#      150-row mapping file collapses to one row per physical sensor here.
#
# Validation runs BEFORE any file is written. If the CSV has a structural
# problem, the script exits non-zero, the init container fails, and the
# new pod never becomes Ready — Kubernetes' default RollingUpdate keeps
# the PREVIOUS working pod serving traffic. A bad CSV edit is inert until
# you explicitly `rollout restart`; it can't silently break the running
# collector. See CHANGES_AND_ARCHITECTURE.md, section 4.
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-th-sensor-render-script
  namespace: gop-telegraf
data:
  render-th-sensor-config.sh: |
    #!/bin/sh
    set -e

    CSV=/sensor-map/sensors.csv
    OUT=/telegraf-d/th-sensor-udp.conf

    # ---------------------------------------------------------------------
    # Validation — fail loud, before writing anything or touching iptables.
    # ---------------------------------------------------------------------
    awk -F',' 'NR>1 && NF!=6 {print "line "NR": expected 6 columns, got "NF; exit 1}' "$CSV"

    DUP_PORTS=$(tail -n +2 "$CSV" | cut -d',' -f2 | sort | uniq -d)
    if [ -n "$DUP_PORTS" ]; then
      echo "FATAL: duplicate port(s) in sensors.csv: $DUP_PORTS"
      exit 1
    fi

    DUP_IPS=$(tail -n +2 "$CSV" | cut -d',' -f1 | sort | uniq -d)
    if [ -n "$DUP_IPS" ]; then
      echo "FATAL: duplicate IP(s) in sensors.csv: $DUP_IPS"
      exit 1
    fi

    tail -n +2 "$CSV" | while IFS=',' read -r IP INTERNAL_LISTENER_PORT PROVIDER_TAG_TEMP PROVIDER_TAG_HUM EQUIPMENT_NAME LOCATION; do
      [ -z "$IP" ] && continue
      echo "$IP" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$' || { echo "FATAL: bad IP: $IP"; exit 1; }
      echo "$INTERNAL_LISTENER_PORT" | grep -qE '^[0-9]+$' || { echo "FATAL: bad port for $IP: $INTERNAL_LISTENER_PORT"; exit 1; }
    done

    # ---------------------------------------------------------------------
    # Generation — validation passed, safe to write.
    # ---------------------------------------------------------------------
    > "$OUT"

    tail -n +2 "$CSV" | while IFS=',' read -r IP INTERNAL_LISTENER_PORT PROVIDER_TAG_TEMP PROVIDER_TAG_HUM EQUIPMENT_NAME LOCATION; do
      [ -z "$IP" ] && continue

      # 3184 is the reserved "default" port — traffic already arrives
      # there unredirected, so no rule needed for that one row.
      if [ "$INTERNAL_LISTENER_PORT" != "3184" ]; then
        iptables -t nat -C PREROUTING -p udp -s "$IP" --dport 3184 -j REDIRECT --to-port "$INTERNAL_LISTENER_PORT" 2>/dev/null \
          || iptables -t nat -A PREROUTING -p udp -s "$IP" --dport 3184 -j REDIRECT --to-port "$INTERNAL_LISTENER_PORT"
      fi

      # Field layout below is per the WIFI-TH datasheet (bit offsets in
      # comments are BIT offsets from start of payload, matching the
      # datasheet's own numbering — not the byte offsets used in earlier
      # hand-decoded versions of this config). One packet carries both
      # temperature and humidity, so both provider_tags from the mapping
      # file are attached here as separate tags on the same point:
      cat >> "$OUT" <<EOF
    [[inputs.socket_listener]]
      service_address = "udp://:${INTERNAL_LISTENER_PORT}"
      data_format = "binary"
      endianness = "be"

      [inputs.socket_listener.tags]
        role = "th-sensor-collector"
        sensor_ip = "${IP}"
        site = "tyo7"
        provider_tag_temp = "${PROVIDER_TAG_TEMP}"
        provider_tag_hum = "${PROVIDER_TAG_HUM}"
        equipment_name = "${EQUIPMENT_NAME}"
        location = "${LOCATION}"

      [[inputs.socket_listener.binary]]
        metric_name = "th_sensor_reading"

        entries = [
          { bits = 16, omit = true },                                        # bit 0:   status flag
          { bits = 8,  omit = true },                                        # bit 16:  protocol version
          { bits = 48, omit = true },                                        # bit 24:  MAC address
          { name = "sensor_type",     type = "uint8",  assignment = "tag" }, # bit 72:  sensor type
          { name = "packet_counter",  type = "uint16" },                     # bit 80:  packet counter
          { name = "group_id",        type = "uint16", assignment = "tag" }, # bit 96:  group ID
          { name = "battery_voltage", type = "uint16" },                     # bit 112: centivolts, scaled by processors.conf
          { bits = 16, omit = true },                                        # bit 128: fw major/minor version
          { name = "rssi",            type = "uint16" },                     # bit 144: RSSI
          { name = "humidity",        type = "uint16" },                     # bit 160: deci-%, scaled by processors.conf
          { name = "temperature",     type = "int16" },                      # bit 176: deci-°C, SIGNED, scaled by processors.conf
          { bits = 144, omit = true },                                       # bit 192-335: reserved (two datasheet rows, combined — safe since both are omitted)
          { bits = 16, omit = true },                                        # bit 336: packet CRC
        ]

        [inputs.socket_listener.binary.filter]
          length = 44

    EOF
    done

    echo "$(date) rendered $(tail -n +2 "$CSV" | wc -l) TH sensor listeners from ${CSV}"