# Prometheus — deployed once per DC. Local, short-retention, single job:
# scrape Telegraf. Durable storage is Thanos, not this instance.
#
# Site-specific fields (server.remoteWrite URL is fixed/shared, but
# external_labels.dc and scrape target change per site) live in
# values/sites/<dc>.yaml and get merged on top of this file.

server:
  retention: "7d"   # local buffer only — Thanos Receive holds the real history

  global:
    scrape_interval: 30s
    evaluation_interval: 30s
    # external_labels.dc is set per-site in values/sites/<dc>.yaml — this is
    # the single label that makes cross-DC Grafana queries/dashboards work.

  remoteWrite:
    - url: "http://thanos-receive.gop-thanos.svc.cluster.local:19291/api/v1/receive"
      # if the site's cluster is a genuinely separate cluster (not sharing
      # cluster-local DNS with the hub), replace with the routable hub
      # ingress URL instead, e.g. https://thanos-receive.tyo7.digitaledgedc.net/api/v1/receive
      queue_config:
        max_samples_per_send: 5000
        max_shards: 30
        capacity: 10000

  persistentVolume:
    enabled: true
    storageClass: longhorn
    size: 30Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

# No ingress block here — routed via k8s/ingress/04-ingressroute-prometheus.yaml
# (prometheus.tyo7.digitaledgedc.net). Do not enable this chart's native
# ingress, or you'll get two competing routes with two different auth systems.

# Scrape config: this chart is plain prometheus-community/prometheus, NOT
# the Prometheus Operator — there is no CRD-based discovery here, no
# ServiceMonitor. Every scrape target is a static_configs entry below,
# added by hand. That also means: every time a new Telegraf release is
# created (per-device-class split, new site, etc.), a job MUST be added
# here manually — nothing auto-discovers it.
#
# One job per Telegraf release (one release per device class), each
# scraping that release's own ClusterIP Service on :9273:
#   - telegraf-tyo7-th-sensors    → 75 TH sensors, CSV-generated config
#   - telegraf-tyo7-juniper-snmp  → Juniper switch via SNMP
#   - telegraf-tyo7-juniper-gnmi  → Juniper switch via gNMI
#   - telegraf-tyo7-plc           → PLCs via OPC-UA (through egress-proxy-opcua
#                                   / VIP .52), tags from plc-mapping.yaml
serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: telegraf-tyo7-th-sensors
        static_configs:
          - targets: ["telegraf-tyo7-th-sensors.gop-telegraf.svc.cluster.local:9273"]

      - job_name: telegraf-tyo7-juniper-snmp
        static_configs:
          - targets: ["telegraf-tyo7-juniper-snmp.gop-telegraf.svc.cluster.local:9273"]

      - job_name: telegraf-tyo7-juniper-gnmi
        static_configs:
          - targets: ["telegraf-tyo7-juniper-gnmi.gop-telegraf.svc.cluster.local:9273"]

      - job_name: telegraf-tyo7-plc
        # ~4.3k series per scrape — allow more than the 10s default timeout
        scrape_timeout: 20s
        static_configs:
          - targets: ["telegraf-tyo7-plc.gop-telegraf.svc.cluster.local:9273"]

        # additional jobs (e.g. node-exporter, kube-state-metrics) can be
        # appended here as GOP's scope grows — no chart change needed

alertmanager:
  enabled: false   # add later if/when per-site alerting is needed;
                    # for now, alerting rules live centrally against Thanos Query